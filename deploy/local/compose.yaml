# Energy Monitor on a private Linux machine, reached only through Tailscale.
# See README, "Kør på en Linux-maskine med Tailscale".
#
#   ../../scripts/pull-secrets.sh    # writes .env from Key Vault
#   docker compose up -d --build
#   sudo tailscale serve --bg 8080

services:
  energymonitor:
    build:
      context: ../..
    image: energy-monitor:local
    restart: unless-stopped
    # Host networking with Kestrel bound to 127.0.0.1: nothing but this machine (and `tailscale serve`
    # on it) can reach the app. The app has no sign-in, so never publish this port any other way.
    network_mode: host
    env_file: .env
    environment:
      ASPNETCORE_URLS: http://127.0.0.1:8080
      # No proxy in front that could be trusted to report client addresses.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "false"
      Auth__Mode: None
      # Only these Host names are answered. Without this, a malicious web page opened in a browser on this
      # machine could point its own domain at 127.0.0.1 (DNS rebinding) and use the app as the administrator.
      # Set TAILNET_HOST in .env to the machine's Tailscale name, e.g. energy.example.ts.net.
      AllowedHosts: ${TAILNET_HOST:?set TAILNET_HOST in .env to the machine's Tailscale name};localhost;127.0.0.1
      Storage__Mode: Sqlite
      Storage__Path: /data/energymonitor.db
    volumes:
      - ./data:/data
