name: Deploy

# Manual only. Requires, per GitHub environment (dev / prod):
#   variables: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_RESOURCE_GROUP
#   a federated credential on that app registration for this repository and environment (no stored secret)
# and filled-in infra/<environment>.bicepparam. See README, "Deployment".
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  deploy:
    # Only reviewed code gets an Azure token: the federated credential is scoped to the environment, not to a
    # branch, so a run from any other branch is refused here. (Also set "Deployment branches" to main in the
    # dev and prod environment settings.)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/energy-monitor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Image name in lower case
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:${{ github.sha }}"
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy infrastructure and app
        # Values reach the script through the environment, never pasted into its text, so a token with a
        # quote, $ or backtick in it is just data.
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          ENVIRONMENT: ${{ inputs.environment }}
          REGISTRY_USERNAME: ${{ github.actor }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters "infra/$ENVIRONMENT.bicepparam" \
            --parameters containerImage="$IMAGE:$GITHUB_SHA" \
                         registryServer=ghcr.io \
                         registryUsername="$REGISTRY_USERNAME" \
                         registryPassword="$GHCR_PULL_TOKEN"
